# Dependency Review Configuration
# https://github.com/actions/dependency-review-action

# Severity levels to fail on
fail-on-severity: high

# Allow licenses
allow-licenses:
  - MIT
  - Apache-2.0
  - BSD-2-Clause
  - BSD-3-Clause
  - ISC
  - CC0-1.0
  - Unlicense
  - WTFPL
  - Zlib
  - MPL-2.0

# Deny licenses
deny-licenses:
  - GPL-2.0
  - GPL-3.0
  - AGPL-3.0
  - LGPL-2.1
  - LGPL-3.0

# Allow specific vulnerabilities by GHSA ID (use sparingly, document why)
# allow-ghsas:
#   - GHSA-xxxx-xxxx-xxxx

# Scope to review (dependencies, devDependencies, all)
scope: all