# Deploy settings
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Functions configuration
[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/functions/**"]

# Security headers for all responses
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "cross-origin"

# Proxy API calls to the Render backend via the same origin,
# so the browser never makes a cross-origin request and CORS is bypassed.
[[redirects]]
  from = "/api/v1/*"
  to = "https://api-dialitech-core-v2.onrender.com/api/v1/:splat"
  status = 200
  force = true
  [redirects.headers]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

# ML Service proxy via Netlify Function (server-side API key injection)
[[redirects]]
  from = "/ml/*"
  to = "/.netlify/functions/ml-proxy/:splat"
  status = 200
  force = true

# SPA fallback for history-mode routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200